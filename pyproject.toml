[project]
name = "bandit-exp"
version = "0.1.0"
description = "A benchmark harness for fairly comparing multi-armed bandit algorithms"
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies: the benchmark harness uses only the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/khattori-dw/bandit-exp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bandit_exp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
